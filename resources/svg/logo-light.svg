<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="CDB">
<!-- ENCRE CLAIRE — ce fichier se pose en thème SOMBRE. Le nom dit l'encre, pas la
     destination (piège connu : logo-light = thème sombre, logo-dark = thème clair).
     Encre #fafafb = window_bg_color du thème clair de libadwaita, mesuré dans
     libadwaita-1.so.0. Bleu #24669F invariant, partagé avec logo-dark.svg : c'est
     la signature B&A, et l'onglet se lit contre le trait qui l'entoure (5,79:1),
     pas contre le fond (2,62:1). Géométrie identique à logo-dark.svg au caractère
     près — seule la valeur de stroke change. -->
  <g fill="none" stroke="#fafafb" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <rect x="5" y="5" width="90" height="90" rx="15" ry="15"/>
    <line x1="95" y1="60" x2="5" y2="60"/>
    <line x1="50" y1="95" x2="50" y2="5"/>
  </g>
  <!-- TILEBAR -->
  <rect x="15" y="15" width="25" height="8" rx="4" fill="#24669F"/>
</svg>
