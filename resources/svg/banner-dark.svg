<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" role="img" aria-label="CDB CodeDashBoard">
<!-- ENCRE SOMBRE (#242424) — ce fichier se pose en thème CLAIR. Le nom dit l'encre,
     pas la destination : banner-dark = thème clair, banner-light = thème sombre.
     L'encre est déclarée TROIS fois (le trait du carré et les deux <text>) : les
     trois doivent changer ensemble. Bleu #24669F invariant. -->
  <!-- SQUARE -->
  <g fill="none" stroke="#242424" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <rect x="5" y="5" width="90" height="90" rx="15" ry="15"/>
    <line x1="95" y1="60" x2="5" y2="60"/>
    <line x1="50" y1="95" x2="50" y2="5"/>
  </g>
  <!-- TILEBAR -->
  <rect x="15" y="15" width="25" height="8" rx="4" fill="#24669F"/>

  <!-- SHORTNAME -->
  <text x="110" y="75"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="100" font-weight="700" fill="#242424"
        letter-spacing="-5">CDB</text>

  <!-- LONGNAME -->
  <text x="110" y="99"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="25" font-weight="500" fill="#242424"
        letter-spacing="0.5">CodeDashBoard</text>
</svg>
